# 版本链示例 · 第 1 步
#
# 加一列。它会先等 beforeVersion: 2 变成 Done 才开始跑。
# 如果版本 2 还没跑，这个 CR 会停在 Blocked 轮询等待 —— 这就是「顺序靠声明」。
apiVersion: db.migration.dev/v1
kind: SchemaMigration
metadata:
  name: migration-v3
spec:
  name: add-remark-column
  changeType: Expand
  driver: mysql
  driverConfig:
    host: mysql.example.com
    port: 3306
    user: root
    database: testdb
    tls: skip-verify
    passwordSecretRef:
      name: mysql-credentials
      key: password
  version: 3
  beforeVersion: 2
  applySql:
    - "alter table test_data add `remark` varchar(100) default null"
