apiVersion: db.migration.dev/v1
kind: SchemaMigration
metadata:
  name: migration-v3
spec:
  operation: apply
  driver: mysql
  driverConfig:
    host: mysql.example.com
    port: 30306
    user: root
    database: testdb
    tls: skip-verify
    passwordSecretRef:
      name: mysql-credentials
      key: password
  version: 4
  beforeVersion: 3
  applySql:
    - "foo bar"
  rollbackSql:
    - "zoo biz"