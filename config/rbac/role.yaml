---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - db.migration.dev
  resources:
  - schemamigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.migration.dev
  resources:
  - schemamigrations/finalizers
  verbs:
  - update
- apiGroups:
  - db.migration.dev
  resources:
  - schemamigrations/status
  verbs:
  - get
  - patch
  - update
