# This rule is not used by the project db-migration-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the db.migration.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: db-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: schemamigration-editor-role
rules:
- apiGroups:
  - db.migration.dev
  resources:
  - schemamigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.migration.dev
  resources:
  - schemamigrations/status
  verbs:
  - get
