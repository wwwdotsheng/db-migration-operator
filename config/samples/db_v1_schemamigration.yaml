apiVersion: db.migration.dev/v1
kind: SchemaMigration
metadata:
  labels:
    app.kubernetes.io/name: db-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: schemamigration-sample
spec:
  databaseRef: "root:root@tcp(mysql.example.com:30306)/testdb?timeout=5s"
  version: 1
  beforeVersion: 0
  applySql: "alter table test_data add `no` varchar(20) default null"
  rollbackSql: "alter table test_data drop `no`"