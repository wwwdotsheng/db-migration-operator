apiVersion: db.migration.dev/v1
kind: SchemaMigration
metadata:
  labels:
    app.kubernetes.io/name: db-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: schemamigration-sample
spec:
  operation: apply
  driver: mysql
  driverConfig:
    host: mysql.example.com
    port: 30306
    user: root
    database: testdb
    tls: skip-verify
    passwordSecretRef:
      name: mysql-credentials
      key: password
  version: 1
  beforeVersion: 0
  applySql:
    - "alter table test_data add `no` varchar(20) default null"
  rollbackSql:
    - "alter table test_data drop `no`"
